<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Caixa de Partículas</title>
<style>
  :root {
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #05050a;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: crosshair;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 16px;
    left: 16px;
    color: #cfd3ff;
    font-size: 13px;
    background: rgba(15, 15, 30, 0.55);
    backdrop-filter: blur(6px);
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    max-width: 260px;
    line-height: 1.5;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  #hud b { color: #fff; }
  #hud.fade { opacity: 0.15; }

  #panel {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    align-items: center;
    background: rgba(15, 15, 30, 0.65);
    backdrop-filter: blur(8px);
    padding: 10px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    flex-wrap: wrap;
    justify-content: center;
    max-width: 92vw;
  }
  .btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.12);
    color: #eaeaff;
    padding: 8px 14px;
    border-radius: 999px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .btn:hover { background: rgba(255,255,255,0.14); }
  .btn.active {
    background: linear-gradient(135deg, #7c5cff, #ff5ca0);
    border-color: transparent;
    color: #fff;
    font-weight: 600;
  }
  input[type=range] {
    width: 90px;
    accent-color: #7c5cff;
  }
  .label {
    color: #a9adcf;
    font-size: 12px;
  }
  #counter {
    position: fixed;
    top: 16px;
    right: 16px;
    color: #6f74a8;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <b>Caixa de Partículas</b><br>
  Mova o mouse para soltar partículas.<br>
  Clique para uma explosão. Segure para atrair ou repelir.
</div>

<div id="counter">0 partículas</div>

<div id="panel">
  <button class="btn active" data-mode="attract">🧲 Atrair</button>
  <button class="btn" data-mode="repel">💥 Repelir</button>
  <button class="btn" data-mode="none">✨ Livre</button>
  <span class="label">|</span>
  <input type="color" id="colorPicker" value="#7c5cff" style="width:34px;height:28px;border:none;border-radius:8px;background:none;cursor:pointer;">
  <span class="label">Rastro</span>
  <input type="range" id="trail" min="1" max="40" value="12">
  <button class="btn" id="clearBtn">🧹 Limpar</button>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hud = document.getElementById('hud');
const counterEl = document.getElementById('counter');

let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();
window.addEventListener('resize', resize);

const mouse = { x: W / 2, y: H / 2, down: false, prevX: W / 2, prevY: H / 2, active: false };
let mode = 'attract';
let hue = 260;
let baseColor = hexToHsl('#7c5cff');
let trailAmount = 12;

function hexToHsl(hex) {
  const r = parseInt(hex.slice(1,3),16)/255, g = parseInt(hex.slice(3,5),16)/255, b = parseInt(hex.slice(5,7),16)/255;
  const max = Math.max(r,g,b), min = Math.min(r,g,b);
  let h, s, l = (max+min)/2;
  if (max === min) { h = s = 0; }
  else {
    const d = max - min;
    s = l > 0.5 ? d/(2-max-min) : d/(max+min);
    switch(max){
      case r: h = (g-b)/d + (g<b?6:0); break;
      case g: h = (b-r)/d + 2; break;
      case b: h = (r-g)/d + 4; break;
    }
    h *= 60;
  }
  return { h, s: s*100, l: l*100 };
}

class Particle {
  constructor(x, y, opts = {}) {
    this.x = x; this.y = y;
    const angle = opts.angle ?? Math.random() * Math.PI * 2;
    const speed = opts.speed ?? Math.random() * 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.life = 1;
    this.decay = opts.decay ?? (0.004 + Math.random() * 0.01);
    this.size = opts.size ?? (1.5 + Math.random() * 2.5);
    this.hue = baseColor.h + (Math.random() * 40 - 20);
  }
  update() {
    if (mode === 'attract' && mouse.down) {
      const dx = mouse.x - this.x, dy = mouse.y - this.y;
      const dist = Math.hypot(dx, dy) || 1;
      const force = Math.min(2200 / (dist * dist), 0.9);
      this.vx += (dx / dist) * force;
      this.vy += (dy / dist) * force;
    } else if (mode === 'repel' && mouse.down) {
      const dx = this.x - mouse.x, dy = this.y - mouse.y;
      const dist = Math.hypot(dx, dy) || 1;
      if (dist < 260) {
        const force = Math.min(2200 / (dist * dist), 2.2);
        this.vx += (dx / dist) * force;
        this.vy += (dy / dist) * force;
      }
    }
    this.vx *= 0.985;
    this.vy *= 0.985;
    this.vy += 0.01; // leve gravidade
    this.x += this.vx;
    this.y += this.vy;
    this.life -= this.decay;

    if (this.x < 0 || this.x > W) this.vx *= -0.6;
    if (this.y < 0 || this.y > H) this.vy *= -0.6;
    this.x = Math.max(0, Math.min(W, this.x));
    this.y = Math.max(0, Math.min(H, this.y));
  }
  draw() {
    const alpha = Math.max(this.life, 0);
    ctx.beginPath();
    const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size * 3);
    grad.addColorStop(0, `hsla(${this.hue}, 90%, 70%, ${alpha})`);
    grad.addColorStop(1, `hsla(${this.hue}, 90%, 60%, 0)`);
    ctx.fillStyle = grad;
    ctx.arc(this.x, this.y, this.size * 3, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.fillStyle = `hsla(${this.hue}, 95%, 80%, ${alpha})`;
    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
    ctx.fill();
  }
}

let particles = [];
const MAX_PARTICLES = 2200;

function spawnTrail(x, y, count = 2) {
  for (let i = 0; i < count; i++) {
    particles.push(new Particle(x, y, { speed: Math.random() * 0.6 }));
  }
}

function spawnBurst(x, y, count = 60) {
  for (let i = 0; i < count; i++) {
    const angle = (Math.PI * 2 * i) / count + Math.random() * 0.2;
    particles.push(new Particle(x, y, {
      angle,
      speed: 1 + Math.random() * 6,
      decay: 0.006 + Math.random() * 0.012,
      size: 1.5 + Math.random() * 3.5
    }));
  }
}

function animate() {
  ctx.fillStyle = `rgba(5, 5, 10, ${1 - trailAmount / 45})`;
  ctx.fillRect(0, 0, W, H);

  if (particles.length > MAX_PARTICLES) {
    particles.splice(0, particles.length - MAX_PARTICLES);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.update();
    p.draw();
    if (p.life <= 0) particles.splice(i, 1);
  }

  counterEl.textContent = `${particles.length} partículas`;
  requestAnimationFrame(animate);
}
animate();

function pos(e) {
  if (e.touches && e.touches[0]) {
    return { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }
  return { x: e.clientX, y: e.clientY };
}

canvas.addEventListener('pointermove', (e) => {
  const p = pos(e);
  mouse.x = p.x; mouse.y = p.y;
  hud.classList.add('fade');
  const dist = Math.hypot(mouse.x - mouse.prevX, mouse.y - mouse.prevY);
  const steps = Math.min(Math.floor(dist / 4), 12);
  for (let i = 0; i < steps; i++) {
    const t = i / steps;
    spawnTrail(mouse.prevX + (mouse.x - mouse.prevX) * t, mouse.prevY + (mouse.y - mouse.prevY) * t, 1);
  }
  if (steps === 0) spawnTrail(mouse.x, mouse.y, 1);
  mouse.prevX = mouse.x; mouse.prevY = mouse.y;
});

canvas.addEventListener('pointerdown', (e) => {
  mouse.down = true;
  const p = pos(e);
  spawnBurst(p.x, p.y, 70);
});
window.addEventListener('pointerup', () => mouse.down = false);

document.querySelectorAll('#panel .btn[data-mode]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#panel .btn[data-mode]').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    mode = btn.dataset.mode;
  });
});

document.getElementById('colorPicker').addEventListener('input', (e) => {
  baseColor = hexToHsl(e.target.value);
});

document.getElementById('trail').addEventListener('input', (e) => {
  trailAmount = Number(e.target.value);
});

document.getElementById('clearBtn').addEventListener('click', () => {
  particles = [];
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, W, H);
});

// alguns fogos de artifício de boas-vindas
setTimeout(() => {
  spawnBurst(W * 0.3, H * 0.4, 80);
  setTimeout(() => spawnBurst(W * 0.7, H * 0.5, 80), 200);
  setTimeout(() => spawnBurst(W * 0.5, H * 0.3, 80), 400);
}, 300);
</script>
</body>
</html>
